<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>LinkBoard - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>🔗 LinkBoard</h1>
      <p class="subtitle">Organize your resources, your way.</p>

      <div class="tabs">
        <button class="tab-btn active" id="loginTab" onclick="showLogin()">Login</button>
        <button class="tab-btn" id="signupTab" onclick="showSignup()">Sign Up</button>
      </div>

      <form id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>

      <form id="signupForm" style="display:none;">
        <input type="text" id="signupUsername" placeholder="Username" required>
        <input type="password" id="signupPassword" placeholder="Password" required>
        <button type="submit">Create Account</button>
      </form>

      <p id="errorMsg" class="error"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
